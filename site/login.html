<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client Login — EchoFrame</title>
  <meta name="description" content="Sign in to your EchoFrame account to manage your subscription, business profile, and monthly reports.">
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="echoframe_logo.png">
  <link rel="apple-touch-icon" href="echoframe_logo.png">
  <style>
    :root {
      --navy: #0A274F;
      --amber: #94681C;
      --amber-soft: #FDF3E3;
      --ink: #111827;
      --ink-soft: #4B5563;
      --ink-faint: #6B7280;
      --line: #E5E7EB;
      --bg: #FFFFFF;
      --bg-soft: #F9FAFB;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px; line-height: 1.65; color: var(--ink);
      background: var(--bg-soft); -webkit-font-smoothing: antialiased;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 40px 20px;
    }
    .card {
      width: 100%; max-width: 440px; background: var(--bg);
      border: 1px solid var(--line); border-radius: 16px;
      padding: 40px 36px; box-shadow: 0 6px 24px rgba(10,39,79,0.06);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
    .brand img { width: 34px; height: 34px; border-radius: 7px; }
    .brand span { font-weight: 700; color: var(--navy); font-size: 19px; }
    h1 { font-size: 23px; color: var(--navy); margin-bottom: 8px; }
    p { color: var(--ink-soft); font-size: 15px; margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
    input[type=email] {
      width: 100%; padding: 13px 14px; border: 1px solid var(--line);
      border-radius: 9px; font-size: 16px; font-family: inherit; margin-bottom: 18px;
    }
    input[type=email]:focus { outline: none; border-color: var(--amber); }
    button {
      width: 100%; background: var(--navy); color: #fff; font-weight: 600;
      font-size: 16px; border: none; padding: 13px; border-radius: 9px;
      cursor: pointer; font-family: inherit;
    }
    button:hover { background: #0c2f60; }
    .fine { margin-top: 20px; font-size: 13px; color: var(--ink-faint); margin-bottom: 0; }
    .back { display: inline-block; margin-top: 24px; font-size: 14px; color: var(--amber); text-decoration: none; }
    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="echoframe_logo.png" alt="EchoFrame">
      <span>EchoFrame</span>
    </div>
    <h1>Sign in to your account</h1>
    <p>Enter the email on your subscription and we'll send you a secure, one-tap sign-in link. No password to remember.</p>
    <form method="post" action="https://echoframe-production.up.railway.app/portal/login">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@yourbusiness.com">
      <button type="submit">Email me a sign-in link</button>
    </form>
    <p class="fine">The link works once and expires in 20 minutes. We never store a password.</p>
    <a class="back" href="/">← Back to echoframe.net</a>
  </div>
</body>
</html>
